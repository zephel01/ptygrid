# scheduled-review — 毎朝 9 時に、自分でレビューを始めさせる
#
# ============================================================================
# 何のためのサンプルか
# ============================================================================
# workflow を起こす方法は、これまで「人が ▶ を押す」か「エージェントが
# spawn_workflow を呼ぶ」の 2 つだけで、どちらも**いま**呼ぶものだった。
# `schedule:`（Phase 5.0.8）は 3 つ目で、時刻が来たら自分で始まる。
#
# cron 式は書けない。書けるのは次の 3 つだけで、**それ以外を書けないことが
# この機能の要**である。
#
#     every: day       + at: "09:00"   … 毎日 9 時
#     every: weekday   + at: "09:00"   … 月〜金の 9 時
#     every: hour      + at: "05"      … 毎時 5 分
#
# 自由な文字列にしないのは、タイプミスが実行時まで運ばれないようにするため。
# `every: dayly` は読み込みの時点で落ち、`at: "9時"` も落ちる。夜になって
# 「動かなかった」と気づくより、保存した瞬間に赤くなるほうがよい。
#
# キー名のタイプミスも同じように落ちる。schedule: の下に書けるのは
# every / at / enabled / maxConsecutiveFailures の 4 つだけで、`enable: false`
# （d 落ち）のように 1 文字ずれたものは黙って無視されず、読み込みでエラーに
# なる。無視されると「止めたつもりのスケジュールが毎朝走る」ことになるため。
#
# ============================================================================
# 先に知っておくこと（4 つ）
# ============================================================================
# (1) **ptygrid が起動している間しか発火しない。**
#     ノートを閉じていた夜の分は、あとから走らない。溜まった分をまとめて流す
#     こともしない（朝アプリを開いた瞬間に 5 本が同時に走り出すほうが事故なので、
#     取りこぼす側に倒してある）。
#     その代わり、Workflows パネルに次回と最終実行が常に出る:
#
#         scheduled-review  🕒 毎日 09:00 · 次回 09:00（あと 3 時間）
#                              · 最終 8/5 09:00 成功
#
#     最終実行が数日前で止まっていたら、それは「アプリを開いていなかった」と
#     いう意味である。ここを見る習慣だけ付けておけばよい。
#
# (2) **前の run がまだ終わっていなければ、その回は飛ばす。**
#     1 時間かかる run を毎時起動しても、3 本が同時に走ることはない。
#     飛ばした理由はパネルに出る（「見送り（前の run が終わっていません）」）。
#
# (3) **グリッド（9 面）に空きが無ければ、その回は飛ばす。**
#     始めてから 5 分待って赤くなる、という形にはしない。
#     このサンプルはペインを 1 枚しか使わないので、普段づかいの数枚が開いて
#     いても問題なく走る。
#     こちらも理由はパネルに出る
#     （「見送り（グリッドに空きがありません。9/9 使用中・1 必要）」）。
#
# (4) **予定時刻を大きく過ぎた回は、あとから走らせない。**
#     蓋を閉じたまま予定時刻をまたいで、夕方に開いたとする。「毎朝 9 時の
#     レビュー」が夕方に始まったら、それは直感に反するし役にも立たない。
#     遅れが「毎時なら 5 分、毎日・平日なら 15 分」を超えていたら、その回は
#     飛ばして次回に送る。パネルには理由が出る
#     （「見送り（予定時刻を 480 分過ぎていました。スリープか時計の移動）」）。
#     数分程度の遅れなら普通に走るので、日常の使用で気にする必要はない。
#
# ============================================================================
# 失敗が続いたら止まる
# ============================================================================
# 3 回続けて失敗したスケジュールは自動的に止まり、パネルに
# 「自動停止（3 回連続で失敗）」と出る。
# 無人で回すものに歯止めが無いと、指示文の書き間違いに気づかないまま課金だけが
# 積み上がるため。回数は maxConsecutiveFailures で変えられる（1〜10）。
#
# 止まる前も見える。1 回目・2 回目の失敗のあいだは
# 「連続失敗 1/3（あと 2 回で自動停止）」がパネルに出るので、
# 気づく機会は止まる前に 2 回ある。
#
# 止まった状態はアプリが覚えているだけで、**ptygrid.yml は書き換えない**。
# **直したら、この設定ファイルを保存し直せば、また動き出す。**
# 「直したら」の中身は、その workflow のどこかを書き換えることである — 下の
# kickoff（指示文）でも、steps でも、schedule でも、その step が使っている
# agent の定義でもよい。逆に、**別の workflow をいじっただけでは再開しない**
# （関係のない編集で歯止めが外れないようにしてある）。
#
# 再開ボタンは無い。スケジュールの設定はこのファイルにしか無く、アプリが
# 設定を書き戻し始めたら、それはもう利用者のファイルではなくなるため。
#
# ============================================================================
# 使い方
# ============================================================================
#   1. このフォルダを ptygrid のディレクトリ指定欄に入れて読み込む。
#   2. それだけ。9 時になったら勝手に始まる。
#   3. 試すときは at を「いまから 2 分後」にして保存する。
#      **保存した瞬間には発火しない**（設定を書いている最中に走り出さない
#      ようにしてある）。2 分後に始まる。

project: scheduled-review

queen:
  enabled: true
  port: 39237

# kickoff は durable inbox に置かれるだけで、ペインには何も打ち込まれない。
# 素の `claude` を起動しても待つだけなので、「起動直後に await を呼べ」は
# cmd の起動引数で渡す（example/review-as-you-go と同じ形）。
agents:
  - name: reviewer
    cmd: >-
      claude "あなたは定時レビュー係です。仕事はこのループだけです。
      (1) queen の await ツール（mcp__queen__await）を
      mailbox=$PTYGRID_MAILBOX, afterId=0, timeoutMs=55000 で呼ぶ。
      (2) messages が空（timedOut が true）なら (1) をもう一度呼ぶ。
      空でなければ (3) へ。
      (3) そのメッセージの id を控える。本文があなたへの指示書なので、
      そこに書かれたとおりに作業する。終わったら queen の reply_inbox ツール
      （mcp__queen__reply_inbox）を id=控えた id, sender=$PTYGRID_MAILBOX,
      body=結果 で呼ぶ。返信は 1 回だけ。
      (4) 返信したら終了してよい。"
    cwd: "."
    autostart: false

workflows:
  scheduled-review:
    # ここが 5.0.8 の全部。
    schedule:
      every: day
      at: "09:00"
      # enabled: false            # 消さずに止めたいときはこれ
      # maxConsecutiveFailures: 3 # 既定 3（1〜10）

    pattern: pipeline

    # autoClose は書かなくてよい。schedule を持つ workflow は既定が success に
    # なる（昨日のペインが残っていて今日の発火が枠不足で飛ぶ、を避けるため）。
    # 明示的に書けばそちらが優先される。

    steps:
      - id: review
        agent: reviewer
        joinOn: reply
        # 無人で走るので上限は必ず書く。返事が来ないまま朝まで居座らせない。
        timeoutMs: 1800000
        kickoff: >-
          このリポジトリの昨日からの変更を確認し、気になった点を
          3 つまで挙げてください。無ければ「気になる点なし」と書いてください。
          終わったら queen の reply_inbox で結果を返信してください。
