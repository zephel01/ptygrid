# review-as-you-go — 上流が1件書き終えるたびに、下流を1体ずつ起こす
#
# ============================================================================
# 何のためのサンプルか
# ============================================================================
# 従来の `dependsOn` は「上流の step が**終わる**まで下流を1秒も動かさない」
# 関門だった。coder が 10 ファイル書く workflow で reviewer が
# `dependsOn: [coder]` を持つと、reviewer は 10 ファイル目が終わるまで待つ。
# 回避策は「coder を10個の step に手で割る」しか無かったが、それは
# **何ファイルになるかを設定を書く時点で知っている場合にしか書けない**。
#
# `onEach: reply`（Phase 5.0.7）はその関門を外す:
#
#     coder が「1件できた」と返信するたびに、reviewer のコピーが1つ生える。
#
# 削れるのは spawn のコストではなく**待ち時間**である。orchestration 自体は
# 1依存あたり 200ms しか食っていないことが合成 workflow の実測で分かっており
# （example/measure-parallelism）、実タスクで効くのは「上流が全部終わるまで
# 下流が待つ」という工程まるごとの待ちのほう。
#
# ============================================================================
# 役割は2つ。上流に `joinOn: stream`、下流に `onEach: reply`
# ============================================================================
#   上流（stream step）: 生き続けたまま、仕事の単位ごとに inbox へ返信する。
#                        返信1本 = **unit**。
#   下流（onEach step）: unit 1本につきコピーを1つ持つ。コピーの step_id は
#                        `reviewer#0` / `reviewer#1` … で、**1本しか来なくても
#                        `#0` が付く**（fan-out は2本以上のときだけ枝番）。
#
# 終わり方は2層ある:
#   第1層 = **番兵**。trim 後の本文が `[[end]]` と**完全一致**する返信1通。
#           部分一致では閉じない（unit 本文の中で `[[end]]` に言及しただけで
#           stream が閉じるのは事故なので、そう設計してある）。
#   第2層 = **上流 step の終端**。番兵を送り忘れても、PTY exit /
#           セマンティック done / `timeoutMs` / cancel のどれかで終端に達した
#           瞬間に stream は閉じる。これは追加のガードではなく実装からの帰結で、
#           終端に達した step の返信はもう誰にも相関されないため。
#
# ============================================================================
# 前提条件（どれか1つでも欠けると測定・実行が成立しない）
# ============================================================================
# (A) `queen.enabled: true` が必須。unit の配送も返信も durable inbox 経由で、
#     ここを切ると kickoff が届かず何も起きない。
#
# (B) 上流の `kickoff:` に**返信の作法を書くのは operator の責任**である。
#     ptygrid はプロトコルを実装するが、エージェントにそれを教えるのは設定側。
#     下の coder の kickoff がその定型文で、削ると unit が1本も出ない。
#     **agents[].cmd の起動プロンプトも同じ理由で必須**（下の囲みを読むこと）。
#     kickoff はペインに打ち込まれないので、cmd を素の `claude` にすると
#     エージェントは起動画面のまま何もせず、step は Running のまま止まる。
#
# (C) **`joinOn: stream` の step には `timeoutMs` を必ず書く。** 番兵を送り
#     忘れたエージェントを1時間待ち続けないための唯一の脱出装置。
#
# (D) グリッドは9面。unit が9本を超えると10本目以降は**待ち行列**に入る
#     （step 行に「waiting for a free pane slot (9/9 occupied)」と出る）。
#     これは正常。兄弟コピーが1つでも動いている間は5分の打ち切りは適用されない。
#
# (E) unit の総数は **64 が上限**。超えると stream step が Failed になって
#     stream が閉じる（暴走したエージェントが run を無限に膨らませるのを止める）。
#
# (F) **この workflow を含む run は resume できない。** クラッシュ・再起動後の
#     再開バナーは失敗として表示され、run は破棄することになる。完了済みコピーの
#     記録を畳んでしまう既存実装を直すのが別 patch になるため、中途半端に
#     再開するより明示的に断っている。
#
# (G) 番兵で完了した stream step の**ペインは exit しない**ので `autoClose` は
#     効かない（`joinOn: reply` と同じ既知の性質）。読み終わったら手で閉じる。
#
# ============================================================================
# 実機で何を見るか
# ============================================================================
#   1. このフォルダを ptygrid のディレクトリ指定欄に入れて読み込む。
#   2. Workflows パネルで `review-as-you-go` を ▶ 実行する。
#   3. **coder が3本目の返信を送る前に、1人目の reviewer が動き出していること**
#      を確認する。これが直列でないことの目視証拠になる。
#   4. パネルに `reviewer#0` / `reviewer#1` … が到着順に増えていく。
#   5. coder が `[[end]]` を送ると coder が Succeeded になり、それ以降は
#      コピーが増えない。全コピーが終わってから summary が1度だけ動く。
#
# 直列との比較を取るなら、`onEach: reply` の行をコメントアウトした版と
# **各2回ずつ**流して run の壁時計を比べること。実エージェントの所要はばらつく
# ので1回では差が判定できない。
# ============================================================================

project: review-as-you-go

queen:
  enabled: true          # (A) 必須
  port: 39237

# ============================================================================
# 【cmd に長いプロンプトを埋めてある理由】ここを削ると何も起きない
# ============================================================================
# kickoff は durable inbox に置かれるだけで、**ペインには何も打ち込まれない**
# （deliver_kickoff は send_inbox を呼ぶだけ）。素の claude を起動しても空の
# プロンプトで待つだけで、自分から inbox を見にいかない。だから「起動直後に
# await を呼べ」という一発目の指示は CLI の起動引数で渡す。
# example/measure-coldstart / example/cross-model-review も同じ形をしている。
#
# cmd は /bin/sh -c に渡される（session.rs の LaunchSpec.shell_wrap: true）。
# プロンプト中でシェルに解釈される文字（" ` \）は使わない。引用は「」。
# $ だけは例外で、下の PTYGRID_MAILBOX にかぎり展開させるために使う。
#
# 【mailbox は $PTYGRID_MAILBOX から取る — onEach 固有の事情】
# onEach のコピーは全部が同じ agent 定義から起動するので、素直に作ると
# mailbox も全部同じ（reviewer）になり、どのペインがどの unit を取るかが
# 早い者勝ちになる。5.0.7 ではコピーごとに専用の mailbox
# （wf/<run_id>/<step_id>）へ kickoff を配り、その名前を環境変数
# PTYGRID_MAILBOX でペインに渡している。await も reply_inbox の sender も
# この値を使うこと（reply_inbox は sender が元メッセージの recipient と
# 完全一致することを要求する）。
# onEach でない step では PTYGRID_MAILBOX の値は agent 定義名そのものなので、
# 全エージェントで同じ書き方が使える。
# cmd は /bin/sh -c に渡されるので $PTYGRID_MAILBOX はシェルが展開する。
# プロンプト中で $ を使ってよいのはここだけ（他の $ ` " \ は避ける）。
# ============================================================================

agents:
  - name: coder
    cmd: >-
      claude "あなたはワークフローの実装役です。仕事はこのループだけです。
      (1) queen の await ツール（mcp__queen__await）を
      mailbox=$PTYGRID_MAILBOX, afterId=0, timeoutMs=55000 で呼ぶ。
      (2) messages が空（timedOut が true）なら (1) をもう一度呼ぶ。
      空でなければ (3) へ。この mailbox にはあなた宛の kickoff しか
      入らないので、どれを選ぶか迷う必要はない。
      (3) そのメッセージの id を控える。本文があなたへの指示書なので、
      そこに書かれたとおりに作業する。返信は queen の reply_inbox ツール
      （mcp__queen__reply_inbox）を id=控えた id, sender=$PTYGRID_MAILBOX,
      body=本文 で呼ぶ。sender は必ずこの環境変数の値にすること。
      (4) 指示書が何度も返信しろと言っている場合は、同じ id に何度でも返信してよい。
      指示書の作業を全部終えたら、待つのをやめてよい。"
    cwd: "."
    autostart: false

  - name: reviewer
    cmd: >-
      claude "あなたはワークフローのレビュー役です。仕事はこのループだけです。
      (1) queen の await ツール（mcp__queen__await）を
      mailbox=$PTYGRID_MAILBOX, afterId=0, timeoutMs=55000 で呼ぶ。
      (2) messages が空（timedOut が true）なら (1) をもう一度呼ぶ。
      空でなければ (3) へ。この mailbox にはあなた宛の kickoff しか
      入らないので、どれを選ぶか迷う必要はない。
      (3) そのメッセージの id を控える。本文があなたへの指示書なので、
      そこに書かれたとおりに作業する。返信は queen の reply_inbox ツール
      （mcp__queen__reply_inbox）を id=控えた id, sender=$PTYGRID_MAILBOX,
      body=本文 で呼ぶ。sender は必ずこの環境変数の値にすること。
      (4) 返信は 1 回だけ。返信したら待つのをやめて終了してよい。"
    cwd: "."
    autostart: false

  - name: summarizer
    cmd: >-
      claude "あなたはワークフローのまとめ役です。仕事はこのループだけです。
      (1) queen の await ツール（mcp__queen__await）を
      mailbox=$PTYGRID_MAILBOX, afterId=0, timeoutMs=55000 で呼ぶ。
      (2) messages が空（timedOut が true）なら (1) をもう一度呼ぶ。
      空でなければ (3) へ。この mailbox にはあなた宛の kickoff しか
      入らないので、どれを選ぶか迷う必要はない。
      (3) そのメッセージの id を控える。本文があなたへの指示書なので、
      そこに書かれたとおりに作業する。返信は queen の reply_inbox ツール
      （mcp__queen__reply_inbox）を id=控えた id, sender=$PTYGRID_MAILBOX,
      body=本文 で呼ぶ。sender は必ずこの環境変数の値にすること。
      (4) 返信は 1 回だけ。返信したら終了してよい。"
    cwd: "."
    autostart: false

workflows:
  review-as-you-go:
    pattern: pipeline
    # レビュー1件の失敗で run 全体を落とさない。既定（fail-fast）だと、
    # コピーが1つ terminal Failed になった時点で**新しい unit の切り出しも
    # 止まる** — run が既に doomed と決まったあとに10枚のペインを開き続けない
    # ため。continue なら他のコピーも unit の切り出しも続く。
    onFailure: continue

    steps:
      # ---- 上流。返信を送り続け、[[end]] で終わる -----------------------
      - id: coder
        agent: coder
        joinOn: stream
        timeoutMs: 1800000     # (C) 30分。番兵を送り忘れたときの脱出装置
        kickoff: >-
          src/ 以下のモジュールを1つずつ実装してください。

          1モジュール書き終えるたびに、queen の reply_inbox を
          id=<このメッセージの id>, sender=coder,
          body=<書いたファイルのパスと変更の要点>
          で呼び、**すぐ次のモジュールに進んで**ください。まとめて報告しないこと。
          1回の返信が1件のレビュー依頼になります。

          すべて終わったら、**本文が [[end]] だけの返信を1通**送ってから
          待機をやめてください。[[end]] は他の文と混ぜないこと
          （混ざっていると1件の作業報告として扱われ、レビュアーが1体増えます）。

      # ---- 下流。unit 1本につき reviewer#k が1体 ------------------------
      - id: reviewer
        agent: reviewer
        dependsOn: [coder]
        onEach: reply          # ← これが `dependsOn` の意味を「完了待ち」から
                               #    「返信ごと」に変える1行
        joinOn: reply          # コピーごとに独立して効く（各コピーが自分の
                               # kickoff スレッドに返信して完了する）
        timeoutMs: 600000
        retry:
          max: 1
          backoffMs: 5000      # 再試行時は unit の本文が再配送されるので、
                               # 2回目のエージェントも「どのファイルの話か」を
                               # ちゃんと受け取る
        kickoff: >-
          直前に示されたファイルだけをレビューしてください。他のファイルは
          見ないこと。仕様との齟齬・エラー処理の抜け・既存テストへの影響の
          3点を見て、終わったら queen の reply_inbox で結果を返信してください。

      # ---- 全部終わってから1度だけ。stream が閉じ、かつ全コピーが終端に
      #      なるまで spawn されない（`dependsOn` は素のまま）--------------
      - id: summary
        agent: summarizer
        dependsOn: [reviewer]
        joinOn: reply
        kickoff: >-
          レビュー結果を1つにまとめ、直すべき箇所を優先度つきで並べてください。
          終わったら queen の reply_inbox で返信してください。

# ============================================================================
# 書けない組み合わせ（load 時に弾かれる。エラー文が理由を言う）
# ============================================================================
#   - `onEach` の依存が `joinOn: stream` でない
#       → `reply` は最初の返信で完了して走査対象から外れるので、2本目以降の
#         返信が誰にも見られない。設定として通ってしまうと「なぜか1件しか
#         レビューされない」になるため、load で断つ。
#   - `onEach` + `fanOut` / `condition` / `handoffTo`
#       → 枝番の意味が二重になる／1度だけの評価とunitごとの起動が噛み合わない／
#         どのコピーの返信を運ぶか決まらない。
#   - `onEach` の `joinOn` に `any` / `n` / `stream`
#       → `any` は敗者を kill するが、コピーは互いに独立した仕事なので誤り。
#         `n` は実行時までコピー数が決まらず範囲検証が成立しない。
#   - `pattern: handoff` での使用、`joinOn: stream` に `kickoff` が無い、
#     `joinOn: stream` を誰も `onEach` で読んでいない。
