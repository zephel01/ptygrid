# ptygrid.yml — ptygrid project config (full annotated example)
#
# Copy this file to your project root as `ptygrid.yml`, then load it from the
# app toolbar. The legacy filename `mterm.yml` is still accepted; when both
# exist, `ptygrid.yml` wins. Relative `cwd` values are resolved against the
# directory containing the config file; `${VAR}` in env values is expanded
# from the host environment (missing variables become empty strings).
#
# Use-case-focused starter configs live in `example/` (basic, multi-agent,
# web-dev, worktree, teammates).
#
# agents:    interactive AI CLIs (get an `instructions` field in Phase 2)
# processes: plain long-running commands (same fields, no instructions)
# autorestart: never | on-failure | always   (default: never)

project: my-app

# queen: the built-in MCP server that lets agent CLIs inside panes read other
# panes, send them messages, spawn config-defined agents, and toast the UI.
# Every spawned session gets env QUEEN_URL=http://127.0.0.1:<port>/mcp.
# Register in Claude Code with:
#   claude mcp add -s user --transport http queen http://127.0.0.1:39237/mcp
# Both fields are optional; the whole block can be omitted.
queen:
  enabled: true   # default true; false stops the server
  port: 39237     # default 39237; if busy, +1 is tried up to 39246

# mcp: `/mcp` RC-compat router flags (Phase 5.5.0, spec-phase5-5.md §3.1/§4.1).
# Governs the dual-transport router in front of the 18 Queen MCP tools above:
# the 2026-07-28 RC transport (Mcp-Method/Mcp-Name headers, no
# Mcp-Session-Id issued) alongside the 2025-06 legacy transport (session id
# issued, Deprecation/Sunset/Link trio on every response) during the
# 12-month deprecation window. Optional; the whole block can be omitted —
# every field defaults to the value shown. Hot-reloadable: editing this
# block and reloading the config takes effect on the next request without
# dropping an already-open connection.
# mcp:
#   rc_2026_07_28: true      # accept the 2026-07-28 RC route
#   legacy_2025_06: true     # keep accepting the 2025-06 legacy route
#   max_body_bytes: 1048576 # 1 MiB per-request body cap for the compat router
#   legacy_capabilities:     # deprecated-capability no-op policy
#     sampling: false        # sampling/* -> real -32601 method_not_found
#     roots: false           # resources/roots -> real -32601 method_not_found
#     logging: true          # logging/setLevel -> 200 no-op (kept working)

# teammates: global switch for receiving Claude Code teammate/subagent hooks
# (Phase 4.0) and auto-adding read-only transcript panes (Phase 4.1). Optional.
# teammates:
#   enabled: false          # default false; true enables hook toasts + observe panes
#   hook_notifications: true
#   global_max_panes: 6     # total teammate panes across all leads (<=9)

# notifications: out-of-app alerts when a session hits a notable edge — an
# abnormal exit, a live agent that blocked on an approval/input prompt, or a
# clean finish. Opt-in: omit the block, or set enabled: false, and nothing is
# sent. Optional; the whole block can be omitted.
#
# Two things combine: the EVENT (derived automatically) and the LEVEL preset a
# channel subscribes to.
#   events: error (abnormal exit) | needs-attention (blocked) | complete | progress
#   levels: silent          -> nothing
#           critical        -> error only                         (default)
#           needs-attention -> error + needs-attention
#           all             -> everything (incl. completion)
# `error` (abnormal termination) is the one you almost always want; that is why
# the default level is `critical` rather than `silent`.
#
# `level:` at the top is the default for every channel; each channel may override
# it, so you can keep a shared Slack quiet (critical) while your own Telegram
# gets the finer-grained needs-attention. Secrets support ${VAR} expansion and
# are read from the host environment at send time.
# notifications:
#   enabled: true
#   level: critical            # global default preset for channels below
#   channels:
#     - type: os               # local desktop toast (macOS/Linux/Windows)
#       level: all             #   in-app, so full detail is fine
#     - type: slack            # Slack incoming webhook: {"text": ...}
#       webhook: "${SLACK_WEBHOOK_URL}"
#     - type: mattermost       # same incoming-webhook shape as Slack
#       webhook: "${MATTERMOST_WEBHOOK_URL}"
#     - type: discord          # Discord webhook: {"content": ...}
#       webhook: "${DISCORD_WEBHOOK_URL}"
#       level: needs-attention
#     - type: telegram         # Telegram Bot API sendMessage
#       bot_token: "${TELEGRAM_BOT_TOKEN}"
#       chat_id: "123456789"
#       level: needs-attention
#       label: mobile          # cosmetic; shown to tell channels apart

# pane_context: ペインごとの「どこに繋がっているか」表示（Phase 4.4.4）。
# 各 running ペインの header と、フォーカス中ペインについては下部ステータスバーに、
# 作業ディレクトリ + git ブランチ / AWS プロファイル・リージョン / エージェント CLI が
# 話している LLM エンドポイント・モデルを表示する。ssh / kubectl の接続先は
# Phase 4.4.3 のペインタイトル（`ssh user@host #2`）が引き続き担当する。
#
# 読み取る環境変数は固定の許可リストのみ（AWS_PROFILE / AWS_VAULT /
# AWS_DEFAULT_PROFILE / AWS_REGION / AWS_DEFAULT_REGION / ANTHROPIC_BASE_URL /
# ANTHROPIC_MODEL / OPENAI_BASE_URL / OPENAI_MODEL / OLLAMA_HOST）。名前が
# *_KEY / *_TOKEN / *_SECRET などの資格情報らしいキーは無条件で捨て、エンドポイント
# URL からは userinfo を落としてから表示する。
#
# 注意: 環境変数はプロセス起動時の値しか読めないため、ペインのシェル起動後に
# export された値（direnv など）は、そのペインで何かコマンドを実行した時点から
# 表示される。作業ディレクトリにこの遅延はない。
#
# 省略可（既定値を以下に示す）。
# pane_context:
#   enabled: true       # false で sampling と session-context イベントを停止
#   interval_ms: 5000   # clamp 1000..60000（CPU/メモリの sampler は 1 秒間隔）

agents:
  - name: claude
    cmd: "claude"
    cwd: "."
    env:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    autostart: false
    autorestart: never
    # Phase 4.1 observe: auto-add a read-only transcript pane when this lead
    # spawns a subagent (requires teammates.enabled above). Optional.
    # teams:
    #   enabled: true
    #   mode: observe        # observe | host
    #   max_panes: 3
    #   transcript_tail: true
    #
    # Phase 4.2 host (experimental, off by default, Unix only): host Claude
    # Code split-pane teammates as native interactive PTY panes. ptygrid drops
    # in a tmux-compat shim + per-lead Unix socket and injects the required env
    # (incl. CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1) automatically — no manual
    # setup. If the shim is not used within 2s, it falls back to observe.
    # Requires enabled: true AND mode: host (opt-in; nothing runs otherwise).
    # teams:
    #   enabled: true
    #   mode: host
    #   max_panes: 3
    #   teammate_binaries: ["claude"]  # argv0 basenames allowed to spawn (default ["claude"])
    #   fallback_to_observe: true      # auto-downgrade to observe when host is unused (default true)

  - name: codex
    cmd: "codex"
    # Optional command used only after restarting ptygrid. If omitted, cmd is used.
    # resume: "codex resume --last"
    cwd: "."
    autostart: false
    # Optional linked-worktree isolation (default disabled).
    # Each launch gets a locked branch under ptygrid/codex/... and runs from
    # the app-data directory. Dirty worktrees are never removed automatically.
    worktree:
      enabled: false
      base: HEAD
      # setup: "npm install"

  - name: grok
    cmd: "grok"
    cwd: "."
    autostart: false

  # Phase 4.4.5: an agent on a remote host, kept alive across dropped links.
  # `ssh:` on an `ssh …` cmd makes ptygrid attach to a named tmux (or screen)
  # session on the remote side and reconnect automatically when the link
  # drops (ssh exit 255) — 1s/2s/4s… backoff, capped at 30s. Your own ssh
  # options stay exactly as written. Requires tmux (or screen) on the remote.
  # - name: gpu-claude
  #   cmd: "ssh -p 2222 me@gpu-box"
  #   ssh:
  #     persist: tmux                # tmux | screen | none   (default tmux)
  #     session: ptygrid-gpu         # default "ptygrid-<name>"; a 2nd/3rd pane of the
  #                                  # same definition gets "-2"/"-3" (use "{n}" to place
  #                                  # the number; a fixed name mirrors one session)
  #     remote_cmd: "claude --continue"   # default: remote login shell
  #     reconnect: true              # default true (only on ssh exit 255)
  #     keepalive: 15                # ServerAliveInterval seconds (default 15)
  #     max_reconnects: 0            # 0 = unlimited (default)

processes:
  - name: web
    cmd: "npm run dev"
    cwd: "."
    autostart: false
    autorestart: on-failure

# team_presets: named team compositions launched in ONE action (toolbar 👥 chip
# or the Queen tool `spawn_team`). Members reference `agents:` definitions by
# name only — a preset can never launch anything spawn_agent could not.
# Validation happens at config load: an unknown member, an empty/all-standby
# member list, or a standby lead FAILS the load with a clear error.
#
# Launch semantics: non-standby members start sequentially in declaration
# order; members whose session is already alive are skipped (idempotent);
# members beyond the 9-pane grid fail with "pane limit" (partial launch).
# `instructions` / `kickoff` are delivered via the durable Queen inbox
# (mailbox = definition name) — only when the call actually started at least
# one member, so re-clicking a running team re-sends nothing.
#
# The intended pattern below: a local-LLM primary (Claude Code routed through
# claude-code-router to llama.cpp/ollama via env) with cloud models declared
# `standby: true` — defined and instructed, but launched only on demand
# (spawn_agent / toolbar ▶) when the local model hits something hard.
# team_presets:
#   daily:
#     lead: local            # kickoff recipient; default = first non-standby
#     members:
#       - agent: local
#         instructions: >-
#           You are the primary worker. If you are stuck after two attempts or
#           the problem needs deep architecture judgement, spawn_agent "opus",
#           send it an inbox message with what you tried, and await the reply.
#       - agent: opus
#         standby: true      # declared only; launched on demand
#         instructions: "Hard problems only: architecture calls and tricky bugs."
#       - agent: grok
#         standby: true
#     kickoff: "Read the pinned task list and start with the top item."
